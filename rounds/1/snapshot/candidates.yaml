# The models this round tests. You choose them (with Claude, in chat); the bench
# never searches for or picks models, and never changes this file.
#
# Each entry:
#   id:          a short name, used everywhere results are shown
#   source:      where it is:
#                  volis:<path under volis's folder>   a model volis already has
#                  hf:<owner>/<name>@<commit>          on Hugging Face; always pin the commit
#   origin:      for a volis: model, the Hugging Face model it came from, pinned,
#                so its model card can be checked for test-data contamination
#   languages:   which languages it's tested on (ar, ar-IQ, fa, en)
#   baseline:    true for what volis runs today (each role needs one)
#   why:         why it's in the test
#   risks:       anything that could make its score misleading (optional)
#   added_in_round, requested_by: optional, for the history

