[project]
name = "model-bench"
version = "0.1.0"
description = "An end-to-end test bench for volis configurations (ASR + translator + prompt)."
requires-python = "==3.12.*"
dependencies = [
    "pyside6",
    "pyyaml",
    "psutil",
    "huggingface_hub",
    "pyarrow",
    "soundfile",
    "soxr",
    "numpy",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
required-version = ">=0.11.26,<0.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
